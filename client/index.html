<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Meta Tags -->
    <title>Company Wise DSA Questions — 17,000+ LeetCode Problems by Company</title>
    <meta name="description" content="Master coding interviews with 17,000+ LeetCode problems organized by company frequency (Google, Amazon, Meta, Microsoft, Apple, TikTok, Uber & more). Track solved status for free." />
    <meta name="keywords" content="company wise DSA questions, LeetCode company questions, Google DSA questions, Amazon coding interview questions, Meta LeetCode frequency, Microsoft interview problems, DSA tracker, company wise problem bank" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="DSA Prep" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:title" content="Company Wise DSA Questions — 17,000+ LeetCode Problems by Company" />
    <meta property="og:description" content="Master coding interviews with 17,000+ LeetCode problems organized by company frequency (Google, Amazon, Meta, Microsoft, Apple, Uber & more)." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://company-wise-dsa-prep.vercel.app/" />
    <meta property="og:site_name" content="DSA Prep" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Company Wise DSA Questions — 17,000+ LeetCode Problems" />
    <meta name="twitter:description" content="Master coding interviews with 17,000+ LeetCode problems organized by company frequency. Free progress tracker with LeetCode sync." />

    <!-- Preconnect / DNS Prefetch -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://leetcode.com" />

    <!-- Schema.org WebSite JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "DSA Prep",
        "alternateName": ["Company Wise DSA Questions", "LeetCode Company Tracker"],
        "url": "https://company-wise-dsa-prep.vercel.app/",
        "description": "Comprehensive company-wise DSA problem bank containing 17,000+ LeetCode questions sorted by frequency across Google, Amazon, Meta, Microsoft, Apple, and 400+ top tech companies.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://company-wise-dsa-prep.vercel.app/questions?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
